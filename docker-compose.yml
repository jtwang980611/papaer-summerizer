services:
  paper-summarizer:
    image: ghcr.io/jtwang980611/paper-summerizer:latest
    container_name: paper-summarizer
    ports:
      - "18860:7860"
    volumes:
      # 挂载输出目录（持久化生成的摘要）
      - ./summaries:/app/summaries
      # 挂载配置目录（持久化API配置）
      - ./data:/app/data
    environment:
      # 从.env文件读取API配置（可选，作为默认值）
      - API_KEY=${API_KEY:-}
      - BASE_URL=${BASE_URL:-}
      - MODEL=${MODEL:-gemini-2.5-flash}
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 300s  # 5分钟检查一次，减少资源消耗
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G  # 降低内存限制
        reservations:
          memory: 256M
    networks:
      - paper-network

networks:
  paper-network:
    driver: bridge

